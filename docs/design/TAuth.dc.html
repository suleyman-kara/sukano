.sk{font-family:Onest,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;

.sk,.sk *{box-sizing:border-box}
:where(.sk) input,:where(.sk) textarea,:where(.sk) button,:where(.sk) select{font:inherit;color:inherit}
:where(.sk) button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
:where(.sk) a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;color:var(--muted);position:relative;flex:0 0 auto;text-decoration:none}
.ib:hover,.ib.on{background:var(--hover);color:var(--fg)}
.ib svg{width:20px;height:20px}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:600;color:#fff;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.dot{width:10px;height:10px;border-radius:999px;flex:0 0 auto;margin:0 5px}
.badge{margin-left:auto;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px}
.sec-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.role{font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.sk{--panel:#E8EFE9}
.sk[data-theme="dark"]{--panel:#1B2420}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:13px;font-weight:500}
.input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);width:100%}
.btn{width:100%;height:44px;gap:10px}
.lnk{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.help{color:var(--muted);font-size:13px;margin:0}
.tab{display:flex;gap:4px;background:var(--hover);border-radius:12px;padding:3px}
.tab button{flex:1;text-align:center;min-height:44px;padding:0 8px;border-radius:9px;font-weight:500;color:var(--muted)}
.tab button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* Arka plan: A "Yükselen ızgara" — logo işaretleri bütün halde, üretim genliği */
.ga-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--accent)}
.ga-g{position:absolute;opacity:.085;--o0:.085;--o1:.13;will-change:transform,opacity;animation:ga-rise 11s cubic-bezier(.45,0,.55,1) infinite alternate both}
.sk[data-theme="dark"] .ga-g{opacity:.11;--o0:.11;--o1:.16}
.ga-g svg{display:block;width:100%;height:100%}
@keyframes ga-rise{from{transform:translate3d(0,0,0);opacity:var(--o0)}to{transform:translate3d(0,var(--amp,-24px),0);opacity:var(--o1)}}
.ga1{animation-duration:12s;animation-delay:-4s;--amp:-26px}.ga2{animation-duration:14s;animation-delay:-9s;--amp:-30px}.ga3{animation-duration:9s;animation-delay:-2s;--amp:-18px}.ga4{animation-duration:11s;animation-delay:-6.5s;--amp:-22px}
.sk[data-motion="reduced"] .ga-g{animation:none !important}
@media (prefers-reduced-motion: reduce){.sk[data-motion="auto"] .ga-g{animation:none !important}}
</style>
</helmet>

    <div style="display:flex; align-items:center; gap:10px">
      <span class="logo-mark" style="width:36px; height:36px; display:inline-flex; flex:0 0 auto; color:var(--accent)"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2.5"/><rect x="13" y="2" width="9" height="9" rx="2.5" opacity=".35"/><rect x="2" y="13" width="9" height="9" rx="2.5" opacity=".35"/><rect x="13" y="13" width="9" height="9" rx="2.5"/></svg></span>

      <div class="tab" aria-label="Giriş veya kayıt"><button class="on">Giriş yap</button><button>Kayıt ol</button></div>
