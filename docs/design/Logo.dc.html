<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.sk{font-family:Onest,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;width:1440px;height:760px;display:flex;flex-direction:column;overflow:hidden}
.sk,.sk *{box-sizing:border-box}
:where(.sk) figure{margin:0}
:where(.sk) p{margin:0}
.strip{flex:1 1 0;display:flex;flex-direction:column;gap:20px;padding:32px 48px;background:var(--bg);color:var(--fg)}
.strip.light{--bg:#F7F6F2;--surface:#FFFFFF;--fg:#1C1B19;--muted:#5F5D57;--line:#E4E2DC;--accent:#2E6B55}
.strip.dark{--bg:#141413;--surface:#1E1E1C;--fg:#ECEAE4;--muted:#AFADA6;--line:#2F2F2C;--accent:#7FC2A6}
.strip-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vars{display:flex;gap:48px;flex:1;min-height:0}
.var{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:18px}
.var + .var{border-left:1px solid var(--line);padding-left:48px}
.var-h{display:flex;align-items:baseline;gap:10px}
.var-k{font-weight:700;font-size:15px;color:var(--accent)}
.var-n{font-weight:600;font-size:15px}
.var-d{font-size:13px;color:var(--muted)}
.uses{display:flex;align-items:flex-end;gap:28px;margin:auto 0}
.use{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.stage{height:104px;display:flex;align-items:center}
.mk{display:inline-flex;flex:0 0 auto;color:var(--accent)}
.lockup{display:inline-flex;align-items:center;gap:10px;height:40px}
.wm{font-weight:700;font-size:28px;line-height:40px;letter-spacing:-0.01em;color:var(--fg)}
.pwa{width:96px;height:96px;border-radius:22px;background:#2E6B55;display:inline-flex;align-items:center;justify-content:center}
figcaption{font-size:11px;color:var(--muted);white-space:nowrap}
</style>
</helmet>
