<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Çevrimdışısın · Sukano</title>
    <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Service worker, çevrimdışıyken önbellekte olmayan bir sayfa istendiğinde bunu verir
      (public/sw.js). Betik yok; stiller satır içi (CSP: public/_headers).
    -->
    <style>
      @font-face {
        font-family: "Onest";
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/onest-latin-ext.woff2") format("woff2");
      }
      :root {
        --bg: #f7f6f2;
        --surface: #ffffff;
        --fg: #1c1b19;
        --muted: #5f5d57;
        --line: #e4e2dc;
        --accent: #2e6b55;
        --accent-fg: #ffffff;
        --warn: #8a5a0b;
        --warn-soft: #fbefd6;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141413;
          --surface: #1e1e1c;
          --fg: #eceae4;
          --muted: #afada6;
          --line: #2f2f2c;
          --accent: #7fc2a6;
          --accent-fg: #0f1f19;
          --warn: #ddaf55;
          --warn-soft: #3a2f17;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 Onest,
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--fg);
        text-decoration: none;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.01em;
        align-self: flex-start;
        border-radius: 10px;
      }
      .logo svg {
        color: var(--accent);
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 40px 0;
      }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: var(--warn-soft);
        color: var(--warn);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 320px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      a:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent);
        outline-offset: 2px;
      }
      @media (min-width: 768px) {
        body {
          padding: 24px 32px;
        }
      }
    </style>
  </head>
  <body>
    <a class="logo" href="/" aria-label="Sukano, ana sayfa">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
        <rect x="2" y="2" width="9" height="9" rx="2.5" />
        <rect x="13" y="2" width="9" height="9" rx="2.5" opacity=".35" />
        <rect x="2" y="13" width="9" height="9" rx="2.5" opacity=".35" />
        <rect x="13" y="13" width="9" height="9" rx="2.5" />
      </svg>
      <span>sukano</span>
    </a>
    <main>
      <span class="icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="30"
          height="30"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
        >
          <path d="M2 2l20 20" />
          <path
            d="M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 3-2.2M12 9a10 10 0 0 1 7 4M2 9a15 15 0 0 1 5-3.3M17 5.5A15 15 0 0 1 22 9"
          />
          <circle cx="12" cy="20" r="1" fill="currentColor" />
        </svg>
      </span>
      <h1>Çevrimdışısın</h1>
      <p>
        Bu sayfa bu cihazda daha önce açılmadığı için çevrimdışı gösterilemiyor. Son açtığın
        sayfalar okunabilir; bağlantı gelince tekrar dene.
      </p>
      <div class="actions">
        <a class="btn primary" href="">Tekrar dene</a>
        <a class="btn" href="/">Notlarıma dön</a>
      </div>
    </main>
  </body>
</html>
